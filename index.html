L[1]={min:50,s:[
["A cosa serve questo linguaggio",`<p>Prima di parlare di muscoli ed esercizi serve una lingua comune. Quando scrivi in una scheda "estensione dell’anca" o riferisci a un fisioterapista un dolore "laterale e prossimale", ogni parola indica una direzione precisa. Chi conosce questi termini descrive un movimento senza ambiguità, legge gli studi scientifici e comunica con medici e colleghi. Oggi costruisci le fondamenta dei 39 giorni successivi.</p>`],
["La posizione anatomica",`<p>Tutti i termini partono da un riferimento: la <b>posizione anatomica</b>. La persona è in piedi, sguardo in avanti, braccia lungo i fianchi, palmi rivolti in avanti, piedi paralleli. Anche se un cliente è sdraiato o a quattro zampe, direzioni e lato (destra e sinistra) si descrivono come se fosse in questa posizione. Il gomito, per esempio, è sempre distale rispetto alla spalla, in qualsiasi posizione si trovi il braccio.</p>`],
["I termini di posizione",`<p>Dicono dove si trova una struttura rispetto a un’altra.</p><ul><li><b>Anteriore (ventrale)</b> e <b>posteriore (dorsale)</b>: davanti e dietro. Lo sterno è anteriore rispetto alla colonna.</li><li><b>Superiore (craniale)</b> e <b>inferiore (caudale)</b>: verso la testa o verso i piedi.</li><li><b>Mediale</b> e <b>laterale</b>: verso la linea mediana del corpo o lontano da essa. L’alluce è mediale rispetto al mignolo del piede.</li><li><b>Prossimale</b> e <b>distale</b>: vicino o lontano dalla radice dell’arto. Il ginocchio è prossimale rispetto alla caviglia.</li><li><b>Superficiale</b> e <b>profondo</b>: vicino alla pelle o lontano da essa.</li></ul>`],
["I tre piani del movimento",`<p>Un piano è una superficie immaginaria che attraversa il corpo. Ogni movimento articolare avviene su un piano e ruota attorno a un <b>asse</b>, sempre perpendicolare al piano. Pensa a una porta: il piano è la porta che si apre, l’asse è la cerniera.</p><ul><li><b>Piano sagittale</b>: divide il corpo in destra e sinistra. Qui avvengono flessione ed estensione, attorno a un asse trasversale (da sinistra a destra).</li><li><b>Piano frontale</b>: divide il corpo in parte anteriore e posteriore. Qui avvengono abduzione, adduzione e inclinazioni laterali, attorno a un asse sagittale (da davanti a dietro).</li><li><b>Piano trasversale</b>: divide il corpo in parte superiore e inferiore. Qui avvengono le rotazioni, attorno a un asse longitudinale (verticale).</li></ul>`],
["I movimenti articolari, uno per uno",`<ul><li><b>Flessione</b>: riduce l’angolo tra due segmenti (gomito, ginocchio, anca). Alla spalla significa portare il braccio avanti e in alto. <b>Estensione</b>: il movimento opposto; oltre la posizione neutra si parla di iperestensione.</li><li><b>Abduzione</b>: allontana un segmento dalla linea mediana. <b>Adduzione</b>: lo avvicina.</li><li><b>Rotazione interna (mediale)</b> ed <b>esterna (laterale)</b>: il segmento ruota attorno al proprio asse, in avanti verso l’interno o verso l’esterno.</li><li><b>Circonduzione</b>: combinazione di flessione, abduzione, estensione e adduzione, che disegna un cono.</li><li><b>Caviglia</b>: dorsiflessione (punta verso lo stinco) e flessione plantare (punta verso il basso). <b>Inversione</b>: pianta del piede verso l’interno. <b>Eversione</b>: verso l’esterno.</li><li><b>Avambraccio</b>: pronazione (palmo verso il basso, gomito flesso a 90°) e supinazione (palmo verso l’alto).</li><li><b>Scapola</b>: elevazione, depressione, protrazione (si allontana dalla colonna), retrazione (si avvicina), rotazione verso l’alto e verso il basso.</li></ul>`],
["Dai nomi agli esercizi",`<p>Lo squat è flessione ed estensione di anca e ginocchio con dorsiflessione di caviglia: piano sagittale. L’alzata laterale è abduzione di spalla: piano frontale. Un chop ai cavi o un Russian twist chiedono rotazione del tronco: piano trasversale. L’affondo laterale lavora soprattutto sul piano frontale.</p><p>Quasi nessun esercizio è puro. La corsa è sagittale, ma bacino e tronco ruotano a ogni passo. Il metodo corretto è individuare il <b>piano dominante</b> e poi chiedersi quali altri piani stabilizzano. Anche il carico conta: un trasporto con la valigetta in una sola mano è una camminata nel piano sagittale, ma il tronco deve resistere all’inclinazione laterale, quindi lavora il piano frontale.</p>`],
["Errori comuni",`<ul><li>Confondere flessione ed estensione di spalla: portare il braccio indietro è estensione, non "retrazione".</li><li>Usare "flessione" per l’esercizio (push-up) e per il movimento: nel push-up, a flettersi è il gomito.</li><li>Scambiare abduzione e rotazione esterna della spalla: la prima cambia il piano del braccio, la seconda lo fa girare su se stesso.</li><li>Dire "dorsale" per indicare "posteriore" del piede: nel piede, il dorso è la parte superiore.</li></ul>`],
["Come studiare oggi (circa 50 minuti)",`<ol><li>Leggi la lezione con calma (15 minuti).</li><li>In piedi, esegui ogni movimento della lista e dillo ad alta voce (15 minuti).</li><li>Prendi 10 esercizi della tua palestra: scrivi piano, asse e movimento di ogni articolazione principale (15 minuti).</li><li>Rispondi al quiz senza guardare la lezione (5 minuti).</li></ol>`]],

q:[["Lo squat avviene soprattutto in quale piano?",["Frontale","Sagittale","Trasversale","Nessuno"],1,"Flessione ed estensione di anca e ginocchio avvengono nel piano sagittale."],["L’alzata laterale con manubri è soprattutto…",["Flessione di spalla","Estensione di spalla","Abduzione di spalla","Rotazione interna"],2,"Il braccio si allontana dalla linea mediana sul piano frontale: abduzione."],[""+"“Prossimale” indica una struttura…",["Più vicina alla radice dell’arto","Più vicina alla pelle","Più vicina alla linea mediana","Più vicina ai piedi"],0,"Prossimale e distale si riferiscono alla distanza dalla radice dell’arto."],["Attorno a quale asse avvengono le rotazioni nel piano trasversale?",["Trasversale","Sagittale","Longitudinale","Frontale"],2,"L’asse è verticale (longitudinale), perpendicolare al piano trasversale."],["La dorsiflessione di caviglia è…",["Punta del piede verso il basso","Punta del piede verso lo stinco","Pianta verso l’interno","Pianta verso l’esterno"],1,"La flessione plantare è il movimento opposto."]]};
L[2]={min:50,s:[
["Perché partire dai principi",`<p>Le schede cambiano con le mode, i principi no. Se capisci perché una scheda funziona, puoi correggerla quando un cliente non progredisce, invece di cambiarla a caso. I principi sono le regole che stanno sotto ogni programma.</p>`],
["Sovraccarico progressivo",`<p>Per adattarsi, il corpo deve ricevere uno stimolo superiore a quello a cui è abituato, e questo stimolo deve crescere nel tempo. Non significa solo aggiungere chili. Le variabili su cui puoi agire sono: carico, ripetizioni, serie, frequenza, tempo sotto tensione, ampiezza del movimento, qualità tecnica e riduzione dei recuperi.</p><p>Per un principiante, la prima progressione è spesso tecnica e di costanza: fare bene lo schema e presentarsi regolarmente vale più di un carico alto. Il sovraccarico deve essere <b>graduale</b>: uno stimolo troppo grande produce fatica e dolore invece di adattamento.</p>`],
["Specificità (principio SAID)",`<p>SAID sta per <i>Specific Adaptations to Imposed Demands</i>: il corpo si adatta in modo specifico a ciò che gli chiedi. Contano il movimento, la velocità di esecuzione, l’ampiezza, il tipo di contrazione e i muscoli coinvolti. Se un cliente vuole correre meglio, la panca piana da sola non basta. Esiste un trasferimento tra esercizi, ma è parziale: più l’esercizio somiglia al compito, più il trasferimento è alto.</p>`],
["Individualizzazione",`<p>Due persone con la stessa scheda rispondono in modo diverso: genetica, storia di allenamento, sonno, alimentazione, stress, età e infortuni cambiano il risultato. La scheda è un’ipotesi da verificare sul cliente, non una verità. Per questo servono anamnesi, diario e rivalutazioni.</p>`],
["Recupero e adattamento",`<p>L’allenamento è lo stimolo, ma l’adattamento avviene nel recupero. Il modello classico è la <b>supercompensazione</b>: dopo la seduta la prestazione scende per la fatica, poi risale oltre il livello di partenza se il carico successivo arriva al momento giusto.</p><p>Il modello <b>fitness-fatica</b> è più realistico: la prestazione dipende dalla differenza tra fitness e fatica. Entrambe salgono dopo l’allenamento, ma la fatica diminuisce più in fretta. Sono semplificazioni, ma utili: allenarsi troppo presto accumula fatica, allenarsi troppo tardi fa perdere stimolo.</p>`],
["Reversibilità",`<p>Se smetti di allenarti, gli adattamenti si perdono: il corpo conserva ciò che usa. Le capacità aerobiche calano in genere prima della forza. Quando un cliente riprende dopo uno stop, riparti da carichi e volumi inferiori e ricostruisci in modo graduale.</p>`],
["Variazione",`<p>Cambiare esercizi, intervalli di ripetizioni e metodi mantiene lo stimolo e distribuisce il carico su tessuti diversi. Ma troppa variazione impedisce di misurare la progressione. Regola pratica: cambia poco e per un motivo preciso, e tieni stabile il resto per poter leggere i risultati.</p>`],
["Come applicarli: tre domande per ogni scheda",`<ol><li>Cosa deve migliorare e in quale compito? (specificità)</li><li>Come aumenterà lo stimolo nelle prossime settimane? (sovraccarico)</li><li>Come sta recuperando questa persona e cosa cambierò se non progredisce? (recupero e individualizzazione)</li></ol>`]],
tab:[["Schema dei principi",["Principio","In una frase","Esempio con un cliente","Errore tipico"],[["Sovraccarico progressivo","Lo stimolo deve crescere nel tempo","Da 3×8 a 3×10, poi aumenti il carico","Aumentare troppo e subito"],["Specificità","Il corpo si adatta a ciò che fai","Camminate e salite per chi vuole fare trekking","Solo macchine per chi vuole migliorare nello sport"],["Individualizzazione","Ognuno risponde in modo diverso","Stessa scheda, due volumi diversi per due persone","Copiare la scheda di un altro"],["Recupero","L’adattamento avviene dopo la seduta","Una settimana di scarico dopo 5 di carico crescente","Aggiungere sempre volume"],["Reversibilità","Senza stimolo si perde l’adattamento","Ripartire con carichi più bassi dopo un mese di stop","Riprendere dal carico di prima"],["Variazione","Cambia poco e con un motivo","Cambiare una variante ogni 4-6 settimane","Cambiare tutto ogni settimana"]]]],
pts:["Il sovraccarico ha molte variabili, non solo il peso.","Specificità: ci si adatta a ciò che si fa.","Il recupero è parte dell’allenamento.","La scheda è un’ipotesi da verificare sul cliente."],
q:[["Quale non è una variabile del sovraccarico progressivo?",["Ripetizioni","Tempo sotto tensione","Colore dell’abbigliamento","Frequenza"],2,"Le variabili sono quelle che modificano lo stimolo allenante."],["SAID significa che…",["Il corpo si adatta in modo specifico alle richieste","Tutti rispondono allo stesso modo","Il recupero non conta","Servono sempre carichi massimali"],0,"Specific Adaptations to Imposed Demands."],["Il modello fitness-fatica dice che…",["La fatica non conta","La prestazione è fitness meno fatica","Il recupero è inutile","Il carico non incide"],1,"Fitness e fatica salgono insieme, ma la fatica cala più in fretta."],["Dopo un mese di stop, il cliente dovrebbe…",["Riprendere dai carichi di prima","Riprendere con carichi e volumi inferiori","Fare solo massimali","Cambiare tutti gli esercizi"],1,"La reversibilità impone una ripresa graduale."],["Perché si dice che la scheda è un’ipotesi?",["Perché le schede non funzionano","Perché la risposta varia da persona a persona","Perché si cambia ogni settimana","Perché non serve il diario"],1,"L’individualizzazione richiede di verificare i risultati su ciascun cliente."]]};
L[3]={min:60,s:[
["Il complesso della spalla",`<p>La spalla non è una sola articolazione, ma un <b>complesso</b> di cinque punti di movimento che lavorano insieme: tre articolazioni sinoviali vere (gleno-omerale, acromion-claveare, sterno-claveare) e due articolazioni funzionali (scapolo-toracica e subacromiale). Il risultato è la mobilità più ampia del corpo, pagata con una stabilità ridotta.</p>`],
["Le ossa",`<ul><li><b>Clavicola</b>: l’unico osso che collega l’arto superiore al tronco, tramite lo sterno. All’estremità laterale si unisce all’acromion.</li><li><b>Scapola</b>: osso piatto sulla parete posteriore del torace. Punti chiave: <i>spina della scapola</i>, <i>acromion</i> (il "tetto" della spalla), <i>processo coracoideo</i>, <i>cavità glenoidea</i> (la superficie che accoglie l’omero), margine mediale e angolo inferiore.</li><li><b>Omero</b>: testa omerale (si articola con la glena), collo anatomico e chirurgico, tuberosità maggiore e minore (inserzioni della cuffia), solco bicipitale (passa il capo lungo del bicipite).</li></ul>`],
["Articolazione gleno-omerale",`<p>È un’articolazione sferoidale con tre gradi di libertà: flessione/estensione, abduzione/adduzione e rotazioni. La testa dell’omero è molto più grande della glena, come una palla da golf su un tee: questo spiega la mobilità e la tendenza alla lussazione. A stabilizzarla contribuiscono il <b>labbro glenoideo</b> (cercine fibrocartilagineo che approfondisce la glena), la capsula articolare, i legamenti gleno-omerali e, soprattutto in movimento, i muscoli della cuffia dei rotatori.</p>`],
["Articolazione scapolo-toracica",`<p>Non è un’articolazione sinoviale: la scapola scivola sulla gabbia toracica, sostenuta dai muscoli. I suoi movimenti sono elevazione, depressione, protrazione, retrazione, rotazione verso l’alto e verso il basso. Senza questa mobilità, la spalla non potrebbe alzare il braccio sopra la testa: una scapola che non ruota limita l’elevazione e carica di più la gleno-omerale.</p>`],
["Il ritmo scapolo-omerale",`<p>Quando alzi il braccio, gleno-omerale e scapolo-toracica si muovono insieme. In media, per ogni 3 gradi di elevazione, circa 2 vengono dalla gleno-omerale e 1 dalla scapolo-toracica (rapporto 2:1). Su 180° di elevazione, sono circa 120° e 60°. Nei primi gradi la scapola si assesta, poi contribuisce di più. Quando la scapola non segue (per debolezza, rigidità o fatica), la spalla compensa e può irritarsi.</p>`],
["Articolazioni acromion-claveare e sterno-claveare",`<p>L’<b>acromion-claveare</b> è una articolazione piana che permette piccoli movimenti della scapola rispetto alla clavicola. La <b>sterno-claveare</b> è l’unico vero punto di aggancio dell’arto superiore al tronco: la clavicola ruota e si alza durante l’elevazione del braccio. Spesso si dimentica, ma ogni sollevamento sopra la testa coinvolge anche questa articolazione.</p>`],
["Lo spazio subacromiale",`<p>Tra l’acromion e la testa dell’omero passa il tendine del sovraspinato, con la borsa subacromiale. Quando si alza il braccio lo spazio si riduce. Se la scapola ruota poco, la postura è alterata o il tendine è irritato, possono comparire dolore nelle alzate sopra la testa e il cosiddetto conflitto subacromiale. È un quadro da valutare con un professionista sanitario, non da trattare a tentativi.</p>`],
["Applicazione in palestra",`<ul><li><b>Military press</b>: richiede rotazione verso l’alto della scapola e buona mobilità toracica.</li><li><b>Rematori</b>: lavorano la retrazione della scapola; tenere le scapole "chiuse" non significa bloccarle del tutto.</li><li><b>Alzate laterali</b>: abduzione della gleno-omerale, con la scapola che ruota verso l’alto dopo i primi gradi.</li></ul>`],
["Come studiare oggi (circa 60 minuti)",`<ol><li>Leggi la lezione e osserva le ossa su un atlante o un’app 3D (20 minuti).</li><li>Su di te, individua con il tatto clavicola, acromion e spina della scapola (10 minuti).</li><li>Alza il braccio lateralmente e osserva dall’esterno come si muove la scapola, poi ripeti con un collega o un cliente (15 minuti).</li><li>Fai il quiz senza rileggere (10 minuti).</li></ol>`]],
tab:[["Le cinque articolazioni della spalla",["Articolazione","Tipo","Movimento","Nota"],[["Gleno-omerale","Sferoidale","Flessione, estensione, abduzione, adduzione, rotazioni","Molto mobile, poco stabile"],["Acromion-claveare","Piana","Piccoli scivolamenti","Sede di lesioni da trauma"],["Sterno-claveare","A sella","Elevazione, protrazione, rotazione della clavicola","Unico aggancio al tronco"],["Scapolo-toracica","Funzionale","Elevazione, depressione, protrazione, retrazione, rotazioni","Scivolamento sulla gabbia toracica"],["Subacromiale","Funzionale","Scorrimento di tendine e borsa","Spazio che si riduce a braccio alzato"]]],["Punti di repere palpabili",["Struttura","Dove trovarla"],[["Clavicola","Sotto la pelle, dallo sterno alla spalla"],["Acromion","Punta ossea alla sommità laterale della spalla"],["Spina della scapola","Linea ossea orizzontale sulla scapola"],["Angolo inferiore","Punta in basso della scapola, visibile durante la trazione"]]]],

L[4]={min:60,s:[
["Cos’è il volume",`<p>Il volume è la quantità di lavoro svolto. Si misura in modi diversi: <b>volume-carico</b> (serie × ripetizioni × chili), <b>numero di ripetizioni</b> e <b>serie settimanali per gruppo muscolare</b>. Per programmare l’ipertrofia, il parametro più usato è quest’ultimo: quante serie dure fai in una settimana per ogni gruppo muscolare.</p>`],
["Che cos’è una serie efficace",`<p>Non tutte le serie contano allo stesso modo. Una serie di riscaldamento a 10 kg non stimola un muscolo allenato. Si parla di <b>serie efficaci</b> o "dure" quando la serie arriva vicino al cedimento, indicativamente entro 0-4 ripetizioni in riserva (RIR). Contare tutto, riscaldamenti compresi, porta a stime sbagliate.</p>`],
["Cosa dice la ricerca",`<p>Le meta-analisi sull’ipertrofia indicano una relazione dose-risposta: più serie settimanali per gruppo tendono a produrre più crescita, ma con <b>rendimenti decrescenti</b>. La risposta varia da persona a persona, quindi i numeri sono indicazioni, non regole.</p><p>In pratica: pochi stimoli fanno poco, tanti stimoli aumentano il recupero richiesto e oltre un certo punto non migliorano più (o peggiorano) i risultati.</p>`],
["I landmark del volume",`<p>Un modello pratico (reso popolare da Mike Israetel) descrive quattro soglie per ogni gruppo muscolare:</p><ul><li><b>MV</b> (volume di mantenimento): basta a conservare il muscolo che hai.</li><li><b>MEV</b> (volume minimo efficace): il minimo per iniziare a crescere.</li><li><b>MAV</b> (volume adattivo massimo): la zona in cui la crescita è migliore.</li><li><b>MRV</b> (volume massimo recuperabile): oltre questo punto non recuperi più.</li></ul><p>Sono una cornice di ragionamento, non valori misurati sulla singola persona.</p>`],
["Valori indicativi per livello",`<p>Per una persona sana e senza particolari limiti, un punto di partenza sono circa 4-10 serie a settimana per gruppo nei principianti e circa 10-20 negli intermedi. Gli avanzati possono tollerare di più, ma spesso con maggiore attenzione al recupero. Ricorda che il tuo cliente medio ha lavoro, stress e poco sonno: spesso il volume reale tollerabile è più basso di quello teorico.</p>`],
["Serie dirette e indirette",`<p>La panca piana allena i pettorali, ma anche deltoidi anteriori e tricipiti. Quanto contare? Un metodo semplice è contare ogni serie diretta come una serie intera e ogni serie indiretta come circa mezza serie. Così, 12 serie di panca e distensioni contano per i pettorali, e portano un contributo ai tricipiti, che richiedono quindi meno lavoro diretto.</p>`],
["Come distribuirlo nella settimana",`<p>Dopo un certo numero di serie nella stessa seduta (spesso 6-10 per gruppo) il guadagno marginale cala, anche per la fatica. Se il volume settimanale è alto, conviene dividerlo in più sedute. Con 12 serie per gruppo, due sedute da 6 sono di solito meglio di una da 12.</p>`],
["Come aumentare il volume",`<p>Parti dal volume più basso che dà risultati. Aggiungi 1-2 serie per gruppo ogni una o due settimane finché la prestazione migliora. Se i carichi calano, il sonno peggiora o compaiono dolori persistenti, sei vicino al tuo limite: riduci il volume o inserisci una settimana di scarico.</p>`],
["Segnali di troppo o troppo poco",`<ul><li><b>Troppo</b>: prestazioni in calo, dolore muscolare che non passa tra le sedute, sonno e umore peggiori, voglia di allenarsi molto ridotta.</li><li><b>Troppo poco</b>: nessun miglioramento in carichi o ripetizioni per settimane, assenza di fatica muscolare nei giorni successivi.</li></ul>`],
["Errori comuni",`<ul><li>Copiare gli split di bodybuilder avanzati per un principiante.</li><li>Contare i riscaldamenti come serie efficaci.</li><li>Aumentare volume e intensità nello stesso momento.</li><li>Pensare che più volume sia sempre meglio.</li></ul>`],
["Come studiare oggi (circa 60 minuti)",`<ol><li>Leggi la lezione e ricopia la tabella dei landmark (20 minuti).</li><li>Prendi una scheda e conta le serie settimanali per gruppo, dirette e indirette (20 minuti).</li><li>Scrivi una proposta di aggiustamento e perché (10 minuti).</li><li>Fai il quiz (10 minuti).</li></ol>`]],
